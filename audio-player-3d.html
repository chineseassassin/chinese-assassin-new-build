<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chinese Assassin — 3D Studio Audio Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Rajdhani:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020002;
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── RESPONSIVE VIEWPORT STAGE (2:1 EXACT ARTWORK COMPOSITION) ── */
    .apb-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      overflow: hidden;
    }

    .apb-stage {
      position: relative;
      width: min(100vw, calc(100vh * (1774 / 887)));
      height: min(100vh, calc(100vw * (887 / 1774)));
      aspect-ratio: 1774 / 887;
      background: #040103 url('/apb_studio_clean.png') center center / 100% 100% no-repeat;
      overflow: hidden;
      box-shadow: 0 0 100px rgba(0, 0, 0, 0.98), 0 0 60px rgba(255, 30, 56, 0.3);
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .apb-stage.shutdown {
      opacity: 0;
      transform: scale(0.92) translateY(30px);
      pointer-events: none;
    }

    /* ── INDEPENDENT FLOATING GLASS CONSOLE ── */
    .apb-glass-console {
      position: absolute;
      left: 18.2%;
      top: 24.2%;
      width: 63.6%;
      height: 48.6%;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(20, 2, 7, 0.92) 0%, rgba(10, 0, 4, 0.96) 100%);
      border: 1px solid rgba(255, 42, 75, 0.55);
      box-shadow: 
        0 25px 65px rgba(0, 0, 0, 0.95),
        0 0 35px rgba(255, 30, 56, 0.35),
        inset 0 1px 2px rgba(255, 255, 255, 0.25),
        inset 0 0 25px rgba(255, 20, 45, 0.12);
      backdrop-filter: blur(24px) saturate(180%);
      z-index: 20;
      display: grid;
      grid-template-columns: 24.5% 48.5% 27.0%;
      padding: 18px 22px;
      gap: 16px;
    }

    /* ── INDEPENDENT LIQUID GLASS CLOSE BUTTON ── */
    .apb-close-btn {
      position: absolute;
      top: -14px;
      right: -14px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff2a4b, #990015);
      border: 2px solid #ffffff;
      cursor: pointer;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 16px;
      font-weight: 900;
      box-shadow: 0 0 18px #ff2a4b, 0 4px 15px rgba(0, 0, 0, 0.8);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .apb-close-btn:hover {
      transform: scale(1.15) rotate(90deg);
      box-shadow: 0 0 30px #ff2a4b, 0 0 50px rgba(255, 42, 75, 0.9);
      background: #ff1133;
    }

    /* ── 1. LEFT PANEL: ALBUM ARTWORK CARD ── */
    .apb-left-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .apb-album-art-wrap {
      width: 100%;
      height: 82%;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255, 42, 75, 0.6);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8), 0 0 25px rgba(255, 30, 56, 0.4);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      cursor: pointer;
    }

    .apb-album-art-wrap:hover {
      transform: scale(1.03);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.9), 0 0 35px rgba(255, 42, 75, 0.7);
    }

    .apb-album-art-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .apb-badge-bottom {
      margin-top: 8px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #ff3344;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(255, 42, 75, 0.6);
    }

    /* ── 2. CENTER PANEL: TYPOGRAPHY, SEEKBAR, TRANSPORT, DSP ── */
    .apb-center-panel {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4px 6px;
    }

    /* Track Metadata */
    .apb-meta-block {
      text-align: center;
    }

    .apb-track-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: clamp(16px, 1.7vw, 24px);
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 0 14px rgba(255, 42, 75, 0.85);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .apb-artist-name {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(11px, 0.95vw, 14px);
      font-weight: 600;
      letter-spacing: 2.5px;
      color: #ff3344;
      text-transform: uppercase;
      margin-top: 2px;
      text-shadow: 0 0 8px rgba(255, 30, 56, 0.5);
    }

    /* Real Interactive Seekbar */
    .apb-seekbar-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 4px 0;
    }

    .apb-time-row {
      display: flex;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #b5b5b5;
    }

    .apb-seekbar-track {
      position: relative;
      width: 100%;
      height: 7px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      cursor: pointer;
      touch-action: none;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 42, 75, 0.25);
    }

    .apb-seekbar-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff2a4b, #ff7744);
      border-radius: 4px;
      box-shadow: 0 0 10px #ff2a4b;
      pointer-events: none;
    }

    .apb-seekbar-thumb {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 8px #ff2a4b, 0 0 16px #ffffff;
      pointer-events: none;
      left: 0%;
      transition: transform 0.1s ease;
    }

    .apb-seekbar-track:hover .apb-seekbar-thumb {
      transform: translate(-50%, -50%) scale(1.25);
    }

    /* Transport Row */
    .apb-transport-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin: 4px 0;
    }

    .apb-trans-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 42, 75, 0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
    }

    .apb-trans-btn svg {
      width: 16px;
      height: 16px;
      fill: #ffffff;
      transition: fill 0.2s ease;
    }

    .apb-trans-btn:hover {
      background: rgba(255, 30, 56, 0.25);
      border-color: #ff2a4b;
      box-shadow: 0 0 14px rgba(255, 30, 56, 0.6);
      transform: scale(1.1);
    }

    .apb-trans-btn.active {
      background: rgba(255, 30, 56, 0.4);
      border-color: #ff2a4b;
      box-shadow: 0 0 16px rgba(255, 42, 75, 0.8);
    }

    .apb-trans-btn.active svg {
      fill: #ff3344;
    }

    /* Big Hero Play/Pause Button */
    .apb-hero-play {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff2a4b 0%, #aa0015 100%);
      border: 2px solid rgba(255, 255, 255, 0.8);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(255, 42, 75, 0.8), 0 5px 15px rgba(0, 0, 0, 0.8);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
    }

    .apb-hero-play svg {
      width: 24px;
      height: 24px;
      fill: #ffffff;
      margin-left: 2px;
      transition: transform 0.2s ease;
    }

    .apb-hero-play:hover {
      transform: scale(1.1);
      box-shadow: 0 0 40px #ff2a4b, 0 0 60px rgba(255, 42, 75, 0.9);
      background: linear-gradient(135deg, #ff3b59 0%, #cc001a 100%);
    }

    /* DSP Enhancements Row */
    .apb-dsp-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }

    .apb-dsp-pill {
      height: 34px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 42, 75, 0.35);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Rajdhani', sans-serif;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.7);
      transition: all 0.2s ease;
      outline: none;
    }

    .apb-dsp-pill:hover {
      background: rgba(255, 30, 56, 0.18);
      border-color: rgba(255, 42, 75, 0.7);
      color: #ffffff;
      box-shadow: 0 0 14px rgba(255, 30, 56, 0.5);
    }

    .apb-dsp-pill.active {
      background: linear-gradient(135deg, rgba(255, 42, 75, 0.4), rgba(180, 0, 25, 0.5));
      border-color: #ff2a4b;
      color: #ffffff;
      box-shadow: 0 0 20px #ff2a4b, inset 0 0 10px rgba(255, 42, 75, 0.5);
      text-shadow: 0 0 8px #ff2a4b;
    }

    /* ── 3. RIGHT PANEL: MODES, SPECTRUM, VOLUME ── */
    .apb-right-panel {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4px 6px;
    }

    .apb-modes-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .apb-mode-btn {
      flex: 1;
      height: 28px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 42, 75, 0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Rajdhani', sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.75);
      transition: all 0.2s ease;
    }

    .apb-mode-btn:hover {
      background: rgba(255, 30, 56, 0.2);
      border-color: #ff2a4b;
      color: #ffffff;
    }

    .apb-mode-btn.active {
      background: rgba(255, 30, 56, 0.4);
      border-color: #ff2a4b;
      box-shadow: 0 0 14px rgba(255, 42, 75, 0.75);
      color: #ffffff;
      text-shadow: 0 0 6px #ff2a4b;
    }

    /* Real FFT Spectrum Canvas */
    .apb-spectrum-box {
      width: 100%;
      height: 72px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 42, 75, 0.25);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .apb-spectrum-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Real Interactive Volume Slider & Mute */
    .apb-volume-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .apb-vol-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'Rajdhani', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #b5b5b5;
    }

    .apb-vol-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .apb-mute-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #ff3344;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      transition: transform 0.2s ease;
    }

    .apb-mute-btn:hover {
      transform: scale(1.15);
      color: #ffffff;
    }

    .apb-mute-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .apb-vol-track {
      position: relative;
      flex: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      cursor: pointer;
      touch-action: none;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 42, 75, 0.25);
    }

    .apb-vol-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ff2a4b, #ff7744);
      border-radius: 4px;
      box-shadow: 0 0 8px #ff2a4b;
      pointer-events: none;
    }

    .apb-vol-thumb {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 8px #ff2a4b;
      pointer-events: none;
      left: 100%;
      transition: transform 0.1s ease;
    }

    .apb-vol-track:hover .apb-vol-thumb {
      transform: translate(-50%, -50%) scale(1.2);
    }

    /* Toast HUD */
    .apb-hud-toast {
      position: absolute;
      bottom: 3.5%;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      padding: 10px 24px;
      background: rgba(10, 0, 4, 0.92);
      border: 1px solid rgba(255, 30, 56, 0.7);
      border-radius: 30px;
      color: #ffffff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow: 0 0 25px rgba(255, 30, 56, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
    }

    .apb-hud-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="apb-viewport">
    <div class="apb-stage" id="apbStage">
      
      <!-- ── INDEPENDENT FLOATING GLASS CONSOLE ── -->
      <div class="apb-glass-console" id="apbGlassConsole">
        
        <!-- CLOSE BUTTON (X) -->
        <button type="button" class="apb-close-btn" id="apbCloseBtn" title="Close 3D Audio Player (Esc)">✕</button>

        <!-- 1. LEFT PANEL: ALBUM ART -->
        <div class="apb-left-panel">
          <div class="apb-album-art-wrap" id="apbAlbumCard" title="Current Mix Album Artwork">
            <img id="apbAlbumImg" src="/public/holographic/card_raise_the_frequency.png" onerror="this.onerror=null; this.src='/public/holographic/card_876_style.png';" alt="Album Cover" />
          </div>
          <div class="apb-badge-bottom">CHINESE ASSASSIN VIP</div>
        </div>

        <!-- 2. CENTER PANEL: TYPOGRAPHY, SEEKBAR, TRANSPORT, DSP -->
        <div class="apb-center-panel">
          <!-- Metadata -->
          <div class="apb-meta-block">
            <div class="apb-track-title" id="apbTrackTitle">Raise The Frequency (Wulup)</div>
            <div class="apb-artist-name" id="apbArtistName">Chinese Assassin DJ • VIP Sound</div>
          </div>

          <!-- Real Interactive Seekbar -->
          <div class="apb-seekbar-container">
            <div class="apb-time-row">
              <span id="apbCurTime">0:00</span>
              <span id="apbTotTime">1:25</span>
            </div>
            <div class="apb-seekbar-track" id="apbSeekbar" title="Seek Audio Track">
              <div class="apb-seekbar-fill" id="apbSeekFill"></div>
              <div class="apb-seekbar-thumb" id="apbSeekThumb"></div>
            </div>
          </div>

          <!-- Transport Controls -->
          <div class="apb-transport-row">
            <!-- Shuffle -->
            <button type="button" class="apb-trans-btn" id="ctrlShuffle" title="Toggle Shuffle">
              <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.42l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.12z"/></svg>
            </button>
            <!-- Previous -->
            <button type="button" class="apb-trans-btn" id="ctrlPrev" title="Restart / Previous Track">
              <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <!-- Big Hero Play/Pause Button -->
            <button type="button" class="apb-hero-play" id="ctrlHeroPlay" title="Play / Pause Audio">
              <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <!-- Next -->
            <button type="button" class="apb-trans-btn" id="ctrlNext" title="Next Mix">
              <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
            <!-- Repeat -->
            <button type="button" class="apb-trans-btn" id="ctrlRepeat" title="Toggle Repeat">
              <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
            </button>
          </div>

          <!-- DSP Enhancements (Bass Boost, 3D Sound, Vocal Clear) -->
          <div class="apb-dsp-row">
            <button type="button" class="apb-dsp-pill" id="btnBassBoost" title="Toggle Bass Boost (+6dB)">BASS BOOST</button>
            <button type="button" class="apb-dsp-pill" id="btn3DSound" title="Toggle 3D Spatial Audio">3D SOUND</button>
            <button type="button" class="apb-dsp-pill" id="btnVocalClear" title="Toggle Vocal Clear DSP">VOCAL CLEAR</button>
          </div>
        </div>

        <!-- 3. RIGHT PANEL: MODES, SPECTRUM, VOLUME -->
        <div class="apb-right-panel">
          <!-- Modes -->
          <div class="apb-modes-row">
            <button type="button" class="apb-mode-btn" id="btnLiveMode" title="Toggle Live DJ Filter (LPF)">LIVE FILTER</button>
            <button type="button" class="apb-mode-btn active" id="btnHDMode" title="HD Audio Master (24-bit FLAC/WAV)">HD AUDIO</button>
          </div>

          <!-- Real FFT Audio Spectrum -->
          <div class="apb-spectrum-box">
            <canvas class="apb-spectrum-canvas" id="apbSpectrumCanvas" width="240" height="72"></canvas>
          </div>

          <!-- Volume Controls -->
          <div class="apb-volume-block">
            <div class="apb-vol-header">
              <span>MASTER VOLUME</span>
              <span id="apbVolText">100%</span>
            </div>
            <div class="apb-vol-row">
              <button type="button" class="apb-mute-btn" id="ctrlMute" title="Mute / Unmute Audio">
                <svg id="volIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                <svg id="muteIcon" viewBox="0 0 24 24" style="display:none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
              </button>
              <div class="apb-vol-track" id="apbVolTrack" title="Drag to adjust volume">
                <div class="apb-vol-fill" id="apbVolFill"></div>
                <div class="apb-vol-thumb" id="apbVolThumb"></div>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- Toast HUD -->
      <div id="apbToast" class="apb-hud-toast"></div>

      <!-- SHARED AUDIO ELEMENT -->
      <audio id="caAudioElem" src="/wulup.mp3" preload="metadata"></audio>
    </div>
  </div>

  <script>
    // ── PROJECT MEDIA CATALOG ──
    const MIXES = [
      {
        id: 'mix_1',
        title: 'Raise The Frequency (Wulup)',
        artist: 'Chinese Assassin DJ',
        src: '/wulup.mp3',
        formatted: '1:25',
        cover: '/public/holographic/card_raise_the_frequency.png'
      },
      {
        id: 'mix_2',
        title: '876 Style Mix 2024',
        artist: 'Chinese Assassin DJ',
        src: '/demo1.mp3',
        formatted: '6:12',
        cover: '/public/holographic/card_876_style.png'
      },
      {
        id: 'mix_3',
        title: 'Celebrate Life Edition',
        artist: 'Chinese Assassin DJ',
        src: '/demo2.mp3',
        formatted: '7:05',
        cover: '/public/holographic/card_celebrate_life.png'
      },
      {
        id: 'mix_4',
        title: 'Reggae Good Vibes Live',
        artist: 'Chinese Assassin DJ',
        src: '/background.mp3',
        formatted: '2:16',
        cover: '/public/holographic/card_reggae_good_vibes.png'
      }
    ];

    let currentIdx = 0;
    let isShuffled = false;
    let isRepeated = false;
    let isBassBoost = false;
    let is3DSound = false;
    let isVocalClear = false;
    let isLiveMode = false;
    let isHDMode = true;

    // DOM Elements
    const stage = document.getElementById('apbStage');
    const audio = document.getElementById('caAudioElem');
    const trackTitle = document.getElementById('apbTrackTitle');
    const artistName = document.getElementById('apbArtistName');
    const curTimeEl = document.getElementById('apbCurTime');
    const totTimeEl = document.getElementById('apbTotTime');
    const albumImg = document.getElementById('apbAlbumImg');
    const seekbar = document.getElementById('apbSeekbar');
    const seekFill = document.getElementById('apbSeekFill');
    const seekThumb = document.getElementById('apbSeekThumb');
    const heroPlay = document.getElementById('ctrlHeroPlay');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const btnShuffle = document.getElementById('ctrlShuffle');
    const btnPrev = document.getElementById('ctrlPrev');
    const btnNext = document.getElementById('ctrlNext');
    const btnRepeat = document.getElementById('ctrlRepeat');
    const btnMute = document.getElementById('ctrlMute');
    const volIcon = document.getElementById('volIcon');
    const muteIcon = document.getElementById('muteIcon');
    const volTrack = document.getElementById('apbVolTrack');
    const volFill = document.getElementById('apbVolFill');
    const volThumb = document.getElementById('apbVolThumb');
    const volText = document.getElementById('apbVolText');
    const btnBass = document.getElementById('btnBassBoost');
    const btn3D = document.getElementById('btn3DSound');
    const btnVocal = document.getElementById('btnVocalClear');
    const btnLive = document.getElementById('btnLiveMode');
    const btnHD = document.getElementById('btnHDMode');
    const closeBtn = document.getElementById('apbCloseBtn');
    const toast = document.getElementById('apbToast');
    const spectrumCanvas = document.getElementById('apbSpectrumCanvas');
    const canvasCtx = spectrumCanvas ? spectrumCanvas.getContext('2d') : null;

    // ── WEB AUDIO API GRAPH ──
    let audioCtx = null;
    let sourceNode = null;
    let bassNode = null;       // Lowshelf filter (+6dB at 180Hz)
    let vocalNode = null;      // Peaking filter (+4.5dB at 3000Hz)
    let liveFilterNode = null;  // Lowpass DJ filter (sweeps to 950Hz in live mode)
    let pannerNode = null;      // StereoPanner for 3D Sound
    let analyserNode = null;    // AnalyserNode for real FFT spectrum
    let isAudioGraphInit = false;

    function initAudioGraph() {
      if (isAudioGraphInit) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        sourceNode = audioCtx.createMediaElementSource(audio);

        // 1. Lowpass Live DJ Filter Node
        liveFilterNode = audioCtx.createBiquadFilter();
        liveFilterNode.type = 'lowpass';
        liveFilterNode.frequency.value = 20000;
        liveFilterNode.Q.value = 3.0;

        // 2. Bass Boost Node
        bassNode = audioCtx.createBiquadFilter();
        bassNode.type = 'lowshelf';
        bassNode.frequency.value = 180;
        bassNode.gain.value = 0;

        // 3. Vocal Clear Node
        vocalNode = audioCtx.createBiquadFilter();
        vocalNode.type = 'peaking';
        vocalNode.frequency.value = 3000;
        vocalNode.Q.value = 1.4;
        vocalNode.gain.value = 0;

        // 4. 3D Spatial Panner Node
        pannerNode = audioCtx.createStereoPanner();
        pannerNode.pan.value = 0;

        // 5. Spectrum Analyser Node
        analyserNode = audioCtx.createAnalyser();
        analyserNode.fftSize = 64;
        analyserNode.smoothingTimeConstant = 0.82;

        // Connect graph in series
        sourceNode.connect(liveFilterNode);
        liveFilterNode.connect(bassNode);
        bassNode.connect(vocalNode);
        vocalNode.connect(pannerNode);
        pannerNode.connect(analyserNode);
        analyserNode.connect(audioCtx.destination);

        isAudioGraphInit = true;
        drawSpectrum();
      } catch (err) {
        console.warn('Web Audio API init error:', err);
      }
    }

    // Real Audio-Reactive Spectrum Drawer
    function drawSpectrum() {
      if (!canvasCtx || !analyserNode) return;
      requestAnimationFrame(drawSpectrum);

      const bufferLength = analyserNode.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyserNode.getByteFrequencyData(dataArray);

      const width = spectrumCanvas.width;
      const height = spectrumCanvas.height;
      canvasCtx.clearRect(0, 0, width, height);

      const barCount = 18;
      const barWidth = (width / barCount) - 3;
      let x = 0;

      for (let i = 0; i < barCount; i++) {
        const val = audio.paused ? 0 : dataArray[i];
        const barHeight = Math.max(3, (val / 255) * height * 0.90);

        const grad = canvasCtx.createLinearGradient(0, height - barHeight, 0, height);
        grad.addColorStop(0, '#ff3344');
        grad.addColorStop(0.6, '#ff1133');
        grad.addColorStop(1, '#990015');

        canvasCtx.fillStyle = grad;
        canvasCtx.shadowColor = '#ff2a4b';
        canvasCtx.shadowBlur = 6;
        canvasCtx.fillRect(x, height - barHeight, barWidth, barHeight);

        x += barWidth + 3;
      }
    }

    // Toast HUD Helper
    let toastTimer;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    // Update Play/Pause Icon
    function updatePlayIcon(isPlaying) {
      if (playIcon) playIcon.style.display = isPlaying ? 'none' : 'block';
      if (pauseIcon) pauseIcon.style.display = isPlaying ? 'block' : 'none';
    }

    // Set & Load Track
    function loadTrack(idx, autoPlay = true) {
      currentIdx = idx;
      const m = MIXES[currentIdx];
      trackTitle.textContent = m.title;
      artistName.textContent = `${m.artist} • VIP SOUND`;
      totTimeEl.textContent = m.formatted;
      curTimeEl.textContent = '0:00';
      if (albumImg) albumImg.src = m.cover;
      seekFill.style.width = '0%';
      seekThumb.style.left = '0%';

      audio.src = m.src;
      if (autoPlay) {
        initAudioGraph();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        audio.play().then(() => {
          stage.classList.add('playing');
          updatePlayIcon(true);
          showToast(`▶ NOW PLAYING: ${m.title}`);
        }).catch(err => {
          console.warn('Autoplay prevented:', err);
          stage.classList.remove('playing');
          updatePlayIcon(false);
        });
      } else {
        stage.classList.remove('playing');
        updatePlayIcon(false);
      }
    }

    // Toggle Play/Pause
    function togglePlay() {
      initAudioGraph();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

      if (audio.paused) {
        audio.play().then(() => {
          stage.classList.add('playing');
          updatePlayIcon(true);
          showToast(`▶ PLAYING: ${MIXES[currentIdx].title}`);
        }).catch(console.warn);
      } else {
        audio.pause();
        stage.classList.remove('playing');
        updatePlayIcon(false);
        showToast('⏸ PAUSED');
      }
    }

    heroPlay.onclick = togglePlay;

    // Time & Seek Updates
    audio.ontimeupdate = () => {
      if (!audio.duration || isSeeking) return;
      const pct = (audio.currentTime / audio.duration) * 100;
      seekFill.style.width = `${pct}%`;
      seekThumb.style.left = `${pct}%`;
      const m = Math.floor(audio.currentTime / 60);
      const s = Math.floor(audio.currentTime % 60).toString().padStart(2, '0');
      curTimeEl.textContent = `${m}:${s}`;
    };

    audio.onended = () => {
      if (!isRepeated) btnNext.click();
    };

    // Real Interactive Drag-to-seek and click-to-seek
    let isSeeking = false;
    function seekToEvent(e) {
      if (!audio || !audio.duration) return;
      const rect = seekbar.getBoundingClientRect();
      const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      audio.currentTime = pos * audio.duration;
      seekFill.style.width = `${pos * 100}%`;
      seekThumb.style.left = `${pos * 100}%`;
      const m = Math.floor(audio.currentTime / 60);
      const s = Math.floor(audio.currentTime % 60).toString().padStart(2, '0');
      curTimeEl.textContent = `${m}:${s}`;
    }

    seekbar.addEventListener('pointerdown', (e) => {
      isSeeking = true;
      try { seekbar.setPointerCapture(e.pointerId); } catch(err){}
      seekToEvent(e);
    });

    seekbar.addEventListener('pointermove', (e) => {
      if (isSeeking) seekToEvent(e);
    });

    const stopSeeking = (e) => {
      if (isSeeking) {
        isSeeking = false;
        try { seekbar.releasePointerCapture(e.pointerId); } catch(err){}
      }
    };
    seekbar.addEventListener('pointerup', stopSeeking);
    seekbar.addEventListener('pointercancel', stopSeeking);

    // Prev / Next Navigation
    btnPrev.onclick = () => {
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
        showToast('⏮ RESTARTING TRACK');
      } else {
        const p = (currentIdx - 1 + MIXES.length) % MIXES.length;
        loadTrack(p, true);
      }
    };

    btnNext.onclick = () => {
      let n;
      if (isShuffled) n = Math.floor(Math.random() * MIXES.length);
      else n = (currentIdx + 1) % MIXES.length;
      loadTrack(n, true);
    };

    btnShuffle.onclick = () => {
      isShuffled = !isShuffled;
      btnShuffle.classList.toggle('active', isShuffled);
      showToast(isShuffled ? '🔀 SHUFFLE: ON' : '🔀 SHUFFLE: OFF');
    };

    btnRepeat.onclick = () => {
      isRepeated = !isRepeated;
      btnRepeat.classList.toggle('active', isRepeated);
      audio.loop = isRepeated;
      showToast(isRepeated ? '🔁 REPEAT: ON' : '🔁 REPEAT: OFF');
    };

    // ── DSP AUDIO ENHANCEMENT HANDLERS (BASS, 3D, VOCAL) ──
    btnBass.onclick = () => {
      initAudioGraph();
      isBassBoost = !isBassBoost;
      btnBass.classList.toggle('active', isBassBoost);
      if (bassNode) {
        bassNode.gain.setTargetAtTime(isBassBoost ? 6.0 : 0.0, audioCtx.currentTime, 0.05);
      }
      showToast(isBassBoost ? '🔥 BASS BOOST: ON (+6dB)' : '🔥 BASS BOOST: FLAT');
    };

    let pannerAnimId = null;
    btn3D.onclick = () => {
      initAudioGraph();
      is3DSound = !is3DSound;
      btn3D.classList.toggle('active', is3DSound);
      if (pannerNode) {
        if (is3DSound) {
          let t = 0;
          function animatePan() {
            if (!is3DSound) return;
            t += 0.035;
            pannerNode.pan.value = Math.sin(t) * 0.65;
            pannerAnimId = requestAnimationFrame(animatePan);
          }
          animatePan();
        } else {
          cancelAnimationFrame(pannerAnimId);
          pannerNode.pan.setTargetAtTime(0, audioCtx.currentTime, 0.05);
        }
      }
      showToast(is3DSound ? '✨ 3D SOUND: SPATIAL MATRIX ACTIVE' : '✨ 3D SOUND: STEREO STANDARD');
    };

    btnVocal.onclick = () => {
      initAudioGraph();
      isVocalClear = !isVocalClear;
      btnVocal.classList.toggle('active', isVocalClear);
      if (vocalNode) {
        vocalNode.gain.setTargetAtTime(isVocalClear ? 4.5 : 0.0, audioCtx.currentTime, 0.05);
      }
      showToast(isVocalClear ? '🎙️ VOCAL CLEAR: ENHANCED (+4.5dB)' : '🎙️ VOCAL CLEAR: FLAT');
    };

    // Live DJ Mode (Lowpass Filter sweep)
    btnLive.onclick = () => {
      initAudioGraph();
      isLiveMode = !isLiveMode;
      btnLive.classList.toggle('active', isLiveMode);
      if (liveFilterNode) {
        const freq = isLiveMode ? 950 : 20000;
        liveFilterNode.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.08);
      }
      showToast(isLiveMode ? '🎛️ LIVE DJ FILTER: ACTIVE (950Hz)' : '🎛️ LIVE DJ FILTER: BYPASSED');
    };

    // HD Audio Mode
    btnHD.onclick = () => {
      isHDMode = !isHDMode;
      btnHD.classList.toggle('active', isHDMode);
      showToast(isHDMode ? '🎧 HD AUDIO: 24-BIT MASTERING ACTIVE' : '🎧 HD AUDIO: STANDARD');
    };

    // ── REAL DRAGGABLE VOLUME SLIDER & MUTE ──
    let isDraggingVol = false;
    function updateVolumeFromEvent(e) {
      const rect = volTrack.getBoundingClientRect();
      const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      audio.volume = pos;
      audio.muted = (pos === 0);
      updateVolumeUI(pos);
    }

    function updateVolumeUI(val) {
      volFill.style.width = `${val * 100}%`;
      volThumb.style.left = `${val * 100}%`;
      volText.textContent = `${Math.round(val * 100)}%`;
      if (volIcon) volIcon.style.display = (audio.muted || val === 0) ? 'none' : 'block';
      if (muteIcon) muteIcon.style.display = (audio.muted || val === 0) ? 'block' : 'none';
    }

    volTrack.addEventListener('pointerdown', (e) => {
      isDraggingVol = true;
      try { volTrack.setPointerCapture(e.pointerId); } catch(err){}
      updateVolumeFromEvent(e);
    });

    volTrack.addEventListener('pointermove', (e) => {
      if (isDraggingVol) updateVolumeFromEvent(e);
    });

    const stopVolDrag = (e) => {
      if (isDraggingVol) {
        isDraggingVol = false;
        try { volTrack.releasePointerCapture(e.pointerId); } catch(err){}
      }
    };
    volTrack.addEventListener('pointerup', stopVolDrag);
    volTrack.addEventListener('pointercancel', stopVolDrag);

    // Mute Button
    btnMute.onclick = () => {
      audio.muted = !audio.muted;
      updateVolumeUI(audio.muted ? 0 : audio.volume);
      showToast(audio.muted ? '🔇 AUDIO MUTED' : `🔊 UNMUTED (${Math.round(audio.volume * 100)}%)`);
    };

    // Close Button Navigation
    closeBtn.onclick = () => {
      showToast('🔒 CLOSING 3D STUDIO PLAYER');
      stage.classList.add('shutdown');
      setTimeout(() => {
        window.location.href = '/page1-aug15-morning.html';
      }, 600);
    };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeBtn.click();
      if (e.key === ' ' && e.target.tagName !== 'INPUT') {
        e.preventDefault();
        togglePlay();
      }
    });

    // Prepare initial track (no auto-play on initial load)
    loadTrack(0, false);
  </script>
</body>
</html>

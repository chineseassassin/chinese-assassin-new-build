`<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chinese Assassin — 3D Holographic Music Universe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Rajdhani:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020002;
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── VIEWPORT WRAPPER (RESPONSIVE 16:9 THEATER STAGE) ── */
    .holo-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      overflow: hidden;
    }

    /* ── 3D HOLOGRAPHIC UNIVERSE STAGE ── */
    .holo-stage {
      position: relative;
      width: min(100vw, calc(100vh * (1678 / 937)));
      height: min(100vh, calc(100vw * (937 / 1678)));
      aspect-ratio: 1678 / 937;
      background: #040103 url('/Chinese%20Assassin%20Holographic%20DJ%20Mixer.png') center center / 100% 100% no-repeat;
      overflow: hidden;
      box-shadow: 0 0 100px rgba(0, 0, 0, 0.98), 0 0 50px rgba(255, 30, 56, 0.3);
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .holo-stage.shutdown {
      opacity: 0;
      transform: scale(0.92) translateY(25px);
      pointer-events: none;
    }

    /* Ambient scanline and hologram grain */
    .holo-scanline-fx {
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(255, 30, 56, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255,0,0,0.03), rgba(0,255,255,0.01), rgba(0,0,255,0.03));
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
      z-index: 5;
      opacity: 0.6;
    }

    /* ── 1. LIQUID GLASS CLOSE BUTTON (UPPER RIGHT) ── */
    .holo-close-btn {
      position: absolute;
      left: 88.5%;
      top: 2.2%;
      width: 10.2%;
      height: 4.8%;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 12px;
      background: rgba(14, 2, 6, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 40, 60, 0.6);
      border-radius: 20px;
      color: #ffffff;
      font-family: 'Rajdhani', sans-serif;
      font-size: clamp(0.65rem, 1.0vw, 0.85rem);
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.85), 0 0 15px rgba(255, 30, 56, 0.35);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
    }

    .holo-close-btn:hover {
      background: rgba(255, 30, 56, 0.3);
      border-color: #ff2a4b;
      box-shadow: 0 0 25px rgba(255, 30, 56, 0.7);
      transform: scale(1.04);
    }

    .holo-close-icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ff2a4b;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 900;
      box-shadow: 0 0 8px #ff2a4b;
    }

    /* ── 2. TOP CATEGORIES HOTSPOTS (INTERACTIVE GLASS TILES) ── */
    .holo-cat-hotspot {
      position: absolute;
      border-radius: 8px;
      cursor: pointer;
      z-index: 20;
      background: transparent;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }

    .holo-cat-hotspot:hover {
      background: rgba(255, 30, 56, 0.15);
      border-color: rgba(255, 40, 60, 0.7);
      box-shadow: 0 0 20px rgba(255, 30, 56, 0.5), inset 0 0 15px rgba(255, 30, 56, 0.2);
    }

    .holo-cat-hotspot.active {
      border-color: #ff2a4b;
      box-shadow: 0 0 25px rgba(255, 30, 56, 0.8), inset 0 0 20px rgba(255, 30, 56, 0.35);
    }

    /* ── 3. FLOATING 3D ALBUM CARDS (HOTSPOTS WITH GLOW) ── */
    .holo-card-hotspot {
      position: absolute;
      border-radius: 12px;
      cursor: pointer;
      z-index: 25;
      background: transparent;
      border: 2px solid transparent;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .holo-card-hotspot:hover {
      background: rgba(255, 30, 56, 0.12);
      border-color: rgba(255, 50, 75, 0.8);
      box-shadow: 0 0 35px rgba(255, 30, 56, 0.65), inset 0 0 20px rgba(255, 30, 56, 0.3);
      transform: scale(1.02);
    }

    .holo-card-hotspot.active {
      border-color: #ff2a4b;
      box-shadow: 0 0 45px rgba(255, 30, 56, 0.9), inset 0 0 25px rgba(255, 30, 56, 0.4);
    }

    /* Live center play button glow overlay */
    .holo-center-play-ring {
      position: absolute;
      bottom: 8%;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      pointer-events: none;
      border: 2px solid #ffffff;
      box-shadow: 0 0 20px #ff2a4b, 0 0 35px rgba(255, 42, 75, 0.8);
      animation: centerRingPulse 2s infinite alternate ease-in-out;
      opacity: 0.85;
    }

    @keyframes centerRingPulse {
      0% { transform: scale(0.96); opacity: 0.7; }
      100% { transform: scale(1.08); opacity: 1; }
    }

    /* ── 4. CONSOLE INTERACTIVE CONTROLS ── */
    /* Transparent Scrubber Seeker Overlay (Preserves Original Painted Track) */
    .holo-scrubber-overlay {
      position: absolute;
      left: 22.53%;
      top: 78.10%;
      width: 23.54%;
      height: 2.20%;
      z-index: 32;
      cursor: pointer;
      display: flex;
      align-items: center;
      background: transparent;
      touch-action: none;
    }

    .holo-scrubber-track-inner {
      position: relative;
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      box-shadow: none;
    }

    /* Duplicate visual progress bar and duplicate thumb suppressed */
    .holo-scrubber-fill-bar {
      display: none !important;
    }

    .holo-scrubber-head {
      display: none !important;
    }

    /* Transport Buttons (Clean Transparent Hotspots - Zero Duplicate Borders/Icons) */
    .holo-ctrl-btn {
      position: absolute;
      border-radius: 50%;
      cursor: pointer;
      z-index: 30;
      background: transparent;
      border: none;
      outline: none;
      box-shadow: none;
      transition: background 0.18s ease, box-shadow 0.18s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .holo-ctrl-btn:hover {
      background: rgba(255, 30, 56, 0.18);
      box-shadow: 0 0 12px rgba(255, 30, 56, 0.5);
    }

    .holo-ctrl-btn.active {
      background: rgba(255, 30, 56, 0.30);
      box-shadow: 0 0 16px rgba(255, 42, 75, 0.7);
    }

    /* Big Center Hero Play/Pause Button (Transparent Hotspot over Original Painted Artwork) */
    .holo-hero-play-btn {
      position: absolute;
      left: 33.67%;
      top: 82.18%;
      width: 4.47%;
      height: 8.00%;
      border-radius: 50%;
      cursor: pointer;
      z-index: 35;
      background: transparent;
      border: none;
      outline: none;
      box-shadow: none;
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }

    .holo-hero-play-btn:hover {
      background: rgba(255, 30, 56, 0.15);
      box-shadow: 0 0 20px rgba(255, 42, 75, 0.6);
    }

    /* Volume Slider (Transparent Functional Overlay over Painted Artwork) */
    .holo-vol-slider-overlay {
      position: absolute;
      left: 55.90%;
      top: 84.50%;
      width: 8.94%;
      height: 3.00%;
      z-index: 32;
      display: flex;
      align-items: center;
      cursor: pointer;
      touch-action: none;
    }

    .holo-vol-input {
      width: 100%;
      height: 100%;
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
      outline: none;
      border: none;
      margin: 0;
      padding: 0;
      opacity: 0.001; /* Completely transparent so only the painted artwork is visible */
    }

    .holo-vol-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      background: transparent;
      cursor: pointer;
    }

    .holo-vol-input::-moz-range-thumb {
      width: 22px;
      height: 22px;
      background: transparent;
      cursor: pointer;
    }

    /* Up Next Queue Clickable Rows */
    .holo-queue-row {
      position: absolute;
      left: 70.32%;
      width: 18.47%;
      height: 2.99%;
      border-radius: 4px;
      cursor: pointer;
      z-index: 30;
      background: transparent;
      border: 1px solid transparent;
      transition: all 0.18s ease;
    }

    .holo-queue-row:hover {
      background: rgba(255, 30, 56, 0.2);
      border-color: rgba(255, 40, 60, 0.6);
      box-shadow: 0 0 12px rgba(255, 30, 56, 0.4);
    }

    .holo-queue-row.active {
      background: rgba(255, 40, 60, 0.35);
      border-color: #ff2a4b;
    }

    /* Duplicate Audio Spectrum Suppressed (Preserves Original Painted Spectrum) */
    .holo-waveform-overlay {
      display: none !important;
      pointer-events: none;
    }

    .holo-eq-bar {
      width: 3px;
      height: 8px;
      background: linear-gradient(180deg, #ff3344, #ff7744);
      border-radius: 2px;
      transition: height 0.08s ease;
    }

    .holo-stage.playing .holo-eq-bar:nth-child(2n) {
      animation: eqBounce1 0.45s infinite alternate ease-in-out;
    }
    .holo-stage.playing .holo-eq-bar:nth-child(2n+1) {
      animation: eqBounce2 0.58s infinite alternate ease-in-out;
    }
    .holo-stage.playing .holo-eq-bar:nth-child(3n) {
      animation: eqBounce3 0.50s infinite alternate ease-in-out;
    }

    @keyframes eqBounce1 { 0% { height: 6px; } 100% { height: 38px; } }
    @keyframes eqBounce2 { 0% { height: 32px; } 100% { height: 8px; } }
    @keyframes eqBounce3 { 0% { height: 12px; } 100% { height: 44px; } }

    /* Dynamic Now Playing Title Overlay */
    .holo-now-title-overlay {
      position: absolute;
      left: 17.2%;
      top: 71.0%;
      width: 25.0%;
      height: 4.2%;
      z-index: 28;
      display: flex;
      flex-direction: column;
      justify-content: center;
      pointer-events: none;
    }

    .holo-track-name {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(0.70rem, 1.1vw, 0.95rem);
      font-weight: 800;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 0 10px rgba(255, 30, 56, 0.6);
    }

    .holo-artist-name {
      font-family: 'Rajdhani', sans-serif;
      font-size: clamp(0.55rem, 0.85vw, 0.72rem);
      font-weight: 700;
      color: rgba(255, 180, 190, 0.85);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Live Time Display */
    .holo-time-overlay {
      position: absolute;
      left: 13.5%;
      top: 77.2%;
      width: 32.5%;
      display: flex;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(0.55rem, 0.8vw, 0.70rem);
      font-weight: 700;
      color: rgba(255, 255, 255, 0.85);
      pointer-events: none;
      z-index: 28;
    }

    /* Toast HUD Notification */
    .holo-hud-toast {
      position: absolute;
      top: 3.5%;
      left: 50%;
      transform: translateX(-50%) translateY(-25px);
      background: rgba(14, 2, 6, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid #ff2a4b;
      border-radius: 30px;
      padding: 7px 22px;
      color: #ffffff;
      font-family: 'Rajdhani', sans-serif;
      font-size: clamp(0.72rem, 1.0vw, 0.88rem);
      font-weight: 700;
      letter-spacing: 1.2px;
      box-shadow: 0 0 25px rgba(255, 42, 75, 0.7);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
    }

    .holo-hud-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

    const curTimeEl = document.getElementById('holoCurTime');
    const totTimeEl = document.getElementById('holoTotTime');
    const scrubFill = document.getElementById('holoScrubberFill');
    const scrubSeeker = document.getElementById('holoScrubberSeeker');
    const heroPlay = document.getElementById('ctrlHeroPlay');
    const btnShuffle = document.getElementById('ctrlShuffle');
    const btnPrev = document.getElementById('ctrlPrev');
    const btnNext = document.getElementById('ctrlNext');
    const btnRepeat = document.getElementById('ctrlRepeat');
    const btnHeart = document.getElementById('ctrlHeart');
    const btnMute = document.getElementById('ctrlMute');
    const volSlider = document.getElementById('holoVolSlider');
    const toast = document.getElementById('holoToast');
    const waveformContainer = document.getElementById('holoWaveformBars');

    // Init 28 Equalizer bars
    for (let i = 0; i < 28; i++) {
      const b = document.createElement('div');
      b.className = 'holo-eq-bar';
      waveformContainer.appendChild(b);
    }

    // Toast HUD
    let toastTimer;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    // Set Track
    function loadTrack(idx, autoPlay = true) {
      currentIdx = idx;
      const m = MIXES[currentIdx];
      trackNameEl.textContent = m.title;
      artistNameEl.textContent = `${m.artist} • VIP SOUND`;
      totTimeEl.textContent = m.formatted;
      scrubFill.style.width = '0%';
      curTimeEl.textContent = '0:00';

      // Update active card highlight
      document.querySelectorAll('.holo-card-hotspot').forEach(c => c.classList.remove('active'));
      const activeCard = document.getElementById(m.cardId);
      if (activeCard) activeCard.classList.add('active');

      audio.src = m.src;
      if (autoPlay) {
        audio.play().then(() => {
          stage.classList.add('playing');
          showToast(`▶ NOW PLAYING: ${m.title}`);
        }).catch(err => {
          console.warn('Autoplay prevented:', err);
          stage.classList.remove('playing');
        });
      } else {
        stage.classList.remove('playing');
      }
    }

    // Play/Pause
    function togglePlay() {
      if (!audio) return;
      if (audio.paused) {
        audio.play().then(() => {
          stage.classList.add('playing');
          showToast(`▶ PLAYING: ${MIXES[currentIdx].title}`);
        }).catch(console.warn);
      } else {
        audio.pause();
        stage.classList.remove('playing');
        showToast('⏸ PAUSED');
      }
    }

    heroPlay.onclick = togglePlay;

    // Scrubber update
    audio.ontimeupdate = () => {
      if (!audio.duration) return;
      const pct = (audio.currentTime / audio.duration) * 100;
      scrubFill.style.width = `${pct}%`;
      const m = Math.floor(audio.currentTime / 60);
      const s = Math.floor(audio.currentTime % 60).toString().padStart(2, '0');
      curTimeEl.textContent = `${m}:${s}`;
    };

    audio.onended = () => {
      if (!isRepeated) btnNext.click();
    };

    // Drag-to-seek and click-to-seek pointer interaction
    let isSeeking = false;
    function seekToEvent(e) {
      if (!audio || !audio.duration) return;
      const rect = scrubSeeker.getBoundingClientRect();
      const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      audio.currentTime = pos * audio.duration;
      const m = Math.floor(audio.currentTime / 60);
      const s = Math.floor(audio.currentTime % 60).toString().padStart(2, '0');
      curTimeEl.textContent = `${m}:${s}`;
    }

    scrubSeeker.addEventListener('pointerdown', (e) => {
      isSeeking = true;
      try { scrubSeeker.setPointerCapture(e.pointerId); } catch(err){}
      seekToEvent(e);
    });

    scrubSeeker.addEventListener('pointermove', (e) => {
      if (isSeeking) seekToEvent(e);
    });

    const stopSeeking = (e) => {
      if (isSeeking) {
        isSeeking = false;
        try { scrubSeeker.releasePointerCapture(e.pointerId); } catch(err){}
      }
    };
    scrubSeeker.addEventListener('pointerup', stopSeeking);
    scrubSeeker.addEventListener('pointercancel', stopSeeking);

    // Prev / Next
    btnPrev.onclick = () => {
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
        showToast('⏮ RESTARTING TRACK');
      } else {
        const p = (currentIdx - 1 + MIXES.length) % MIXES.length;
        loadTrack(p, true);
      }
    };

    btnNext.onclick = () => {
      let n;
      if (isShuffled) n = Math.floor(Math.random() * MIXES.length);
      else n = (currentIdx + 1) % MIXES.length;
      loadTrack(n, true);
    };

    btnShuffle.onclick = () => {
      isShuffled = !isShuffled;
      btnShuffle.classList.toggle('active', isShuffled);
      showToast(isShuffled ? '🔀 SHUFFLE: ON' : '🔀 SHUFFLE: OFF');
    };

    btnRepeat.onclick = () => {
      isRepeated = !isRepeated;
      btnRepeat.classList.toggle('active', isRepeated);
      audio.loop = isRepeated;
      showToast(isRepeated ? '🔁 REPEAT: ON' : '🔁 REPEAT: OFF');
    };

    btnHeart.onclick = () => {
      btnHeart.classList.toggle('active');
      showToast(btnHeart.classList.contains('active') ? '❤️ FAVORITE SAVED' : '🤍 FAVORITE REMOVED');
    };

    // Volume
    volSlider.oninput = (e) => {
      audio.volume = parseFloat(e.target.value);
      audio.muted = audio.volume === 0;
    };

    btnMute.onclick = () => {
      audio.muted = !audio.muted;
      showToast(audio.muted ? '🔇 MUTED' : '🔊 UNMUTED');
    };

    // Category click
    document.querySelectorAll('.holo-cat-hotspot').forEach(cat => {
      cat.onclick = () => {
        document.querySelectorAll('.holo-cat-hotspot').forEach(c => c.classList.remove('active'));
        cat.classList.add('active');
        showToast(`📁 CATEGORY: ${cat.title}`);
      };
    });

    // 3D Card clicks
    document.getElementById('cardRaiseFrequency').onclick = () => loadTrack(0, true);
    document.getElementById('card876Style').onclick = () => loadTrack(1, true);
    document.getElementById('cardCelebrateLife').onclick = () => loadTrack(2, true);
    document.getElementById('cardWeekendVibes').onclick = () => loadTrack(3, true);
    document.getElementById('cardStraightFire').onclick = () => loadTrack(4, true);
    document.getElementById('cardReggaeGoodVibes').onclick = () => loadTrack(5, true);
    document.getElementById('cardUpInnaDiSky').onclick = () => loadTrack(6, true);

    // Queue Row clicks
    document.getElementById('qRow1').onclick = () => loadTrack(1, true);
    document.getElementById('qRow2').onclick = () => loadTrack(2, true);
    document.getElementById('qRow3').onclick = () => loadTrack(3, true);
    document.getElementById('qRow4').onclick = () => loadTrack(6, true);
    document.getElementById('qRow5').onclick = () => {
      showToast('🔒 MIX PREVIEW: GIRL NEXT DOOR (COMING SOON)');
    };

    // CLOSE BUTTON & SHUTDOWN ANIMATION
    closeBtn.onclick = () => {
      showToast('🔒 INITIATING HOLOGRAPHIC SHUTDOWN SEQUENCE');
      stage.classList.add('shutdown');
      setTimeout(() => {
        window.location.href = '/page1-aug15-morning.html';
      }, 650);
    };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeBtn.click();
      if (e.key === ' ' && e.target.tagName !== 'INPUT') {
        e.preventDefault();
        togglePlay();
      }
    });

    // Initial load: Prepare without autoplay
    loadTrack(0, false);
  </script>
</body>
</html>`

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chinese Assassin | Cyber Dragon Media Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% 50%, #160408 0%, #080103 60%, #020001 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Outfit', sans-serif;
      color: #ffffff;
      position: relative;
    }

    /* Ambient Atmosphere Grid & Embers */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 30, 50, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 30, 50, 0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 1;
    }

    .bg-glow {
      position: absolute;
      width: 80vw;
      height: 400px;
      background: radial-gradient(ellipse at 50% 50%, rgba(255, 20, 45, 0.18) 0%, transparent 70%);
      filter: blur(60px);
      pointer-events: none;
      z-index: 2;
    }

    /* Page Header */
    .showcase-header {
      position: absolute;
      top: 30px;
      text-align: center;
      z-index: 10;
    }

    .showcase-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(22px, 3.2vw, 36px);
      font-weight: 900;
      letter-spacing: 0.25em;
      color: #fff;
      text-shadow: 0 0 25px rgba(255, 32, 58, 0.8), 0 0 50px rgba(255, 32, 58, 0.4);
    }

    .showcase-subtitle {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.35em;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 6px;
      text-transform: uppercase;
    }

    /* ══════════════════════════════════════════════════════════════════════
       MASTER CYBER DRAGON MEDIA PLAYER CONTAINER
       ══════════════════════════════════════════════════════════════════════ */
    .player-showcase-wrap {
      position: relative;
      z-index: 10;
      width: 96vw;
      max-width: 1440px;
      padding: 40px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dragon-player-deck {
      position: relative;
      width: 100%;
      height: clamp(140px, 16vw, 190px);
      max-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 20px 50px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 35px rgba(255, 25, 45, 0.3));
    }

    /* High-Res Chassis Artwork */
    .deck-chassis-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      z-index: 5;
    }

    /* Ambient Dragon Fire Crest Breathing Effect */
    .dragon-fire-glow {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 90px;
      background: radial-gradient(ellipse at 50% 50%, rgba(255, 30, 50, 0.6) 0%, transparent 70%);
      filter: blur(20px);
      pointer-events: none;
      z-index: 3;
      animation: dragonPulse 3.5s ease-in-out infinite alternate;
    }

    @keyframes dragonPulse {
      0% { opacity: 0.4; transform: translateX(-50%) scale(0.92); }
      100% { opacity: 0.95; transform: translateX(-50%) scale(1.1); filter: blur(24px); }
    }

    /* Interactive Overlay Grid for Hotspots */
    .deck-interactive-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: grid;
      grid-template-columns: 2.2fr 1.6fr 1.6fr 1.1fr;
      align-items: center;
      padding: 0 4.5%;
    }

    /* ── 1. LEFT FLANK: TURNTABLE & TRACK INFO ────────────────────────── */
    .left-track-module {
      display: flex;
      align-items: center;
      gap: 16px;
      height: 100%;
      padding-left: 2%;
    }

    .platter-wrap {
      position: relative;
      width: clamp(55px, 6.5vw, 82px);
      height: clamp(55px, 6.5vw, 82px);
      cursor: pointer;
      flex-shrink: 0;
    }

    .platter-disc {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, #200408 0%, #0a0103 70%, #ff203a 100%);
      border: 2px solid rgba(255, 40, 60, 0.8);
      box-shadow: 0 0 16px rgba(255, 30, 50, 0.6), inset 0 0 10px rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }

    .platter-disc.spinning {
      animation: spinPlatter 4s linear infinite;
    }

    @keyframes spinPlatter {
      100% { transform: rotate(360deg); }
    }

    .platter-logo {
      width: 78%;
      height: 78%;
      border-radius: 50%;
      object-fit: cover;
    }

    .track-meta-wrap {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    .meta-series {
      font-size: clamp(9px, 0.85vw, 11px);
      font-weight: 800;
      letter-spacing: 0.25em;
      color: #ff334b;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .meta-title {
      font-size: clamp(14px, 1.35vw, 19px);
      font-weight: 800;
      letter-spacing: 0.05em;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
    }

    .meta-info-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
      font-size: clamp(10px, 0.9vw, 12px);
      color: rgba(255, 255, 255, 0.7);
      font-weight: 500;
    }

    .meta-eq-bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 12px;
      margin-top: 6px;
    }

    .eq-bar {
      width: 4px;
      height: 4px;
      background: #ff203a;
      border-radius: 1px;
      box-shadow: 0 0 6px #ff203a;
      transition: height 0.1s ease;
    }

    .eq-bar.active {
      animation: eqBounce 0.6s ease-in-out infinite alternate;
    }

    .eq-bar:nth-child(1) { animation-delay: 0.1s; }
    .eq-bar:nth-child(2) { animation-delay: 0.3s; }
    .eq-bar:nth-child(3) { animation-delay: 0.15s; }
    .eq-bar:nth-child(4) { animation-delay: 0.45s; }
    .eq-bar:nth-child(5) { animation-delay: 0.25s; }
    .eq-bar:nth-child(6) { animation-delay: 0.5s; }
    .eq-bar:nth-child(7) { animation-delay: 0.35s; }
    .eq-bar:nth-child(8) { animation-delay: 0.2s; }

    @keyframes eqBounce {
      0% { height: 3px; }
      100% { height: 14px; }
    }

    .heart-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      font-size: 15px;
      transition: all 0.2s ease;
      margin-left: 6px;
    }

    .heart-btn:hover, .heart-btn.active {
      color: #ff2a4b;
      transform: scale(1.2);
      text-shadow: 0 0 10px #ff2a4b;
    }

    /* ── 2. CENTER: TRANSPORT CONTROLS ─────────────────────────────────── */
    .center-transport-module {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 1.2vw, 18px);
      height: 100%;
    }

    .transport-btn {
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .transport-btn svg {
      filter: drop-shadow(0 0 6px rgba(255, 30, 50, 0.6));
    }

    .transport-btn:hover {
      color: #ffffff;
      transform: scale(1.15);
    }

    .transport-btn:active {
      transform: scale(0.92);
    }

    .btn-shuffle, .btn-repeat {
      width: clamp(28px, 2.5vw, 36px);
      height: clamp(28px, 2.5vw, 36px);
      border-radius: 50%;
    }

    .btn-shuffle.active, .btn-repeat.active {
      color: #ff334b;
      filter: drop-shadow(0 0 8px #ff334b);
    }

    .btn-prev, .btn-next {
      width: clamp(32px, 2.8vw, 42px);
      height: clamp(32px, 2.8vw, 42px);
    }

    /* Master Core Play/Pause Button */
    .btn-master-play {
      position: relative;
      width: clamp(54px, 5.2vw, 72px);
      height: clamp(54px, 5.2vw, 72px);
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, #ff2a4b 0%, #a00d1e 60%, #40030a 100%);
      box-shadow: 0 0 25px rgba(255, 40, 60, 0.85), inset 0 0 15px rgba(255, 255, 255, 0.6);
      border: 2px solid rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 15;
    }

    .btn-master-play::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1.5px dashed rgba(255, 50, 75, 0.7);
      animation: rotateRing 12s linear infinite;
    }

    @keyframes rotateRing {
      100% { transform: rotate(360deg); }
    }

    .btn-master-play:hover {
      transform: scale(1.1);
      box-shadow: 0 0 40px rgba(255, 40, 60, 1), inset 0 0 20px rgba(255, 255, 255, 0.9);
    }

    .btn-master-play:active {
      transform: scale(0.95);
    }

    .btn-master-play svg {
      fill: #ffffff;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.8));
    }

    /* ── 3. RIGHT ZONE 1: LIVE SPECTRUM VISUALIZER & VOLUME ──────────── */
    .visualizer-volume-module {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      height: 100%;
      padding: 0 12px;
    }

    .viz-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .badge-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }

    .badge-live {
      background: #ff1e38;
      color: #fff;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.15em;
      padding: 2px 7px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(255, 30, 50, 0.8);
      animation: liveBlink 1.5s ease-in-out infinite alternate;
    }

    @keyframes liveBlink {
      0% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    .badge-hd {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      font-size: 9px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 10px;
    }

    .viz-canvas-wrap {
      width: 100%;
      height: clamp(30px, 3.2vw, 42px);
      background: rgba(10, 2, 4, 0.7);
      border: 1px solid rgba(255, 35, 55, 0.3);
      border-radius: 4px;
      overflow: hidden;
    }

    #visualizerCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .volume-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .vol-icon-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.8);
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .vol-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff203a;
      box-shadow: 0 0 10px #ff203a;
      cursor: pointer;
    }

    /* ── 4. RIGHT ZONE 2: LIVE DJ FILTER EQ CONSOLE ───────────────────── */
    .dj-filter-module {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding-right: 4%;
    }

    .dj-filter-title {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.18em;
      color: #ff334b;
      text-transform: uppercase;
      margin-bottom: 8px;
      text-shadow: 0 0 8px rgba(255, 40, 60, 0.8);
    }

    .dj-faders-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 1.4vw, 18px);
    }

    .fader-track {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .vertical-slider {
      -webkit-appearance: none;
      appearance: none;
      writing-mode: bt-lr; /* IE/Edge */
      -webkit-appearance: slider-vertical;
      width: 8px;
      height: clamp(45px, 4.8vw, 62px);
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      cursor: pointer;
      outline: none;
    }

    .fader-lbl {
      font-size: 8px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 0.05em;
    }

    /* HUD Toast */
    .hud-toast {
      position: absolute;
      top: 15px;
      padding: 6px 18px;
      background: rgba(14, 3, 6, 0.95);
      border: 1px solid rgba(255, 40, 60, 0.8);
      border-radius: 20px;
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.1em;
      box-shadow: 0 0 20px rgba(255, 25, 45, 0.8);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
      transition: all 0.25s ease;
      z-index: 100;
    }

    .hud-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Back Link to Main Experience */
    .back-btn-wrap {
      margin-top: 30px;
      z-index: 20;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 24px;
      background: rgba(20, 4, 8, 0.85);
      border: 1px solid rgba(255, 35, 55, 0.5);
      border-radius: 30px;
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-decoration: none;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(255, 25, 45, 0.3);
      transition: all 0.25s ease;
    }

    .back-link:hover {
      background: rgba(255, 32, 58, 0.2);
      border-color: #ff334b;
      box-shadow: 0 0 30px rgba(255, 32, 58, 0.7);
      transform: translateY(-2px);
    }

    /* Responsive scaling */
    @media (max-width: 900px) {
      .deck-interactive-layer {
        grid-template-columns: 2fr 1.6fr 1.6fr;
      }
      .dj-filter-module {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <!-- Showcase Header -->
  <header class="showcase-header">
    <h1 class="showcase-title">CHINESE ASSASSIN</h1>
    <p class="showcase-subtitle">CYBER DRAGON MASTER PLAYER</p>
  </header>

  <!-- Player Showcase Container -->
  <div class="player-showcase-wrap">
    <div id="toast" class="hud-toast">PLAYING: SHADOW WARRIOR</div>

    <div class="dragon-player-deck">
      <!-- High-Res Chassis Visual Layer -->
      <img src="/MEDIAPLAYER.png" alt="Chinese Assassin Media Player" class="deck-chassis-img" />

      <!-- Dragon Fire Breathing Aura -->
      <div class="dragon-fire-glow"></div>

      <!-- Live Interactive Controls & Overlays -->
      <div class="deck-interactive-layer">
        
        <!-- 1. LEFT: Turntable Platter & Track Metadata -->
        <div class="left-track-module">
          <div class="platter-wrap" id="platterBtn" title="Scratch / Spin Turntable">
            <div class="platter-disc" id="platterDisc">
              <img src="/CA_DRAGON_LOGO.png" onerror="this.src='/logo.png'" alt="CA Crest" class="platter-logo" />
            </div>
          </div>

          <div class="track-meta-wrap">
            <span class="meta-series">CHINESE ASSASSIN</span>
            <h2 class="meta-title" id="trackTitle">Shadow Warrior</h2>
            <div class="meta-info-row">
              <span id="artistName">Chinese Assassin</span> • <span id="timeDisplay">0:00 / 3:14</span>
              <button class="heart-btn" id="heartBtn" title="Favorite Track">♥</button>
            </div>
            <!-- Animated Equalizer Bars -->
            <div class="meta-eq-bars" id="eqBars">
              <div class="eq-bar"></div>
              <div class="eq-bar"></div>
              <div class="eq-bar"></div>
              <div class="eq-bar"></div>
              <div class="eq-bar"></div>
              <div class="eq-bar"></div>
              <div class="eq-bar"></div>
              <div class="eq-bar"></div>
            </div>
          </div>
        </div>

        <!-- 2. CENTER: Transport Controls -->
        <div class="center-transport-module">
          <button class="transport-btn btn-shuffle" id="shuffleBtn" title="Shuffle (S)">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
            </svg>
          </button>

          <button class="transport-btn btn-prev" id="prevBtn" title="Previous Track (←)">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
            </svg>
          </button>

          <!-- Master Center Red Core Play/Pause -->
          <button class="btn-master-play" id="playBtn" title="Play / Pause (Space)">
            <svg id="playIcon" viewBox="0 0 24 24" width="26" height="26">
              <polygon points="7,5 19,12 7,19" />
            </svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" width="26" height="26" style="display: none;">
              <rect x="6" y="5" width="4" height="14" />
              <rect x="14" y="5" width="4" height="14" />
            </svg>
          </button>

          <button class="transport-btn btn-next" id="nextBtn" title="Next Track (→)">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
            </svg>
          </button>

          <button class="transport-btn btn-repeat active" id="repeatBtn" title="Repeat (R)">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
            </svg>
          </button>
        </div>

        <!-- 3. RIGHT ZONE 1: Live Audio Spectrum Analyzer & Volume -->
        <div class="visualizer-volume-module">
          <div class="viz-top-row">
            <div class="badge-wrap">
              <span class="badge-live">LIVE</span>
              <span class="badge-hd">HD</span>
            </div>
          </div>

          <div class="viz-canvas-wrap">
            <canvas id="visualizerCanvas"></canvas>
          </div>

          <div class="volume-row">
            <button class="vol-icon-btn" id="volBtn" title="Mute / Unmute (M)">
              <svg id="volIcon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
              </svg>
            </button>
            <input type="range" id="volSlider" min="0" max="1" step="0.01" value="0.85" class="vol-slider" title="Volume Slider" />
          </div>
        </div>

        <!-- 4. RIGHT ZONE 2: Live 3-Band DJ Filter Console -->
        <div class="dj-filter-module">
          <span class="dj-filter-title">LIVE DJ FILTER</span>
          <div class="dj-faders-wrap">
            <div class="fader-track">
              <input type="range" id="filterLow" min="200" max="20000" value="20000" step="100" class="vertical-slider" title="Lowpass Filter Cutoff" />
              <span class="fader-lbl">LPF</span>
            </div>
            <div class="fader-track">
              <input type="range" id="filterBass" min="0" max="15" value="0" step="0.5" class="vertical-slider" title="Bass Boost Gain" />
              <span class="fader-lbl">BASS</span>
            </div>
            <div class="fader-track">
              <input type="range" id="filterFx" min="0" max="100" value="0" step="1" class="vertical-slider" title="Cyber Stutter Beat Chop" />
              <span class="fader-lbl">CHOP</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Back Link -->
  <div class="back-btn-wrap">
    <a href="/" class="back-link">
      <span>←</span> ENTER CA UNIVERSE EXPERIENCE
    </a>
  </div>

  <!-- Audio Element & WebAudio FX Script -->
  <audio id="mainAudio" src="/background.mp3" preload="metadata"></audio>

  <script>
    (function() {
      const tracks = [
        { title: 'Shadow Warrior', artist: 'Chinese Assassin', duration: '3:14', src: '/background.mp3' },
        { title: 'Dragon Fire Mix', artist: 'Chinese Assassin', duration: '4:05', src: '/demo1.mp3' },
        { title: 'VIP Dimension Blend', artist: 'Chinese Assassin', duration: '3:48', src: '/demo2.mp3' }
      ];

      let currentTrackIdx = 0;
      let isPlaying = false;
      let isShuffled = false;
      let isLooped = true;
      let isMuted = false;
      let volume = 0.85;

      const audio = document.getElementById('mainAudio');
      const playBtn = document.getElementById('playBtn');
      const playIcon = document.getElementById('playIcon');
      const pauseIcon = document.getElementById('pauseIcon');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const shuffleBtn = document.getElementById('shuffleBtn');
      const repeatBtn = document.getElementById('repeatBtn');
      const heartBtn = document.getElementById('heartBtn');
      const platterBtn = document.getElementById('platterBtn');
      const platterDisc = document.getElementById('platterDisc');
      const trackTitle = document.getElementById('trackTitle');
      const artistName = document.getElementById('artistName');
      const timeDisplay = document.getElementById('timeDisplay');
      const eqBars = document.querySelectorAll('.eq-bar');
      const volBtn = document.getElementById('volBtn');
      const volSlider = document.getElementById('volSlider');
      const filterLow = document.getElementById('filterLow');
      const filterBass = document.getElementById('filterBass');
      const filterFx = document.getElementById('filterFx');
      const toast = document.getElementById('toast');
      const canvas = document.getElementById('visualizerCanvas');
      const ctx = canvas.getContext('2d');

      // WebAudio Setup
      let audioCtx = null;
      let sourceNode = null;
      let lowpassNode = null;
      let bassNode = null;
      let analyser = null;
      let dataArray = null;

      function initWebAudio() {
        if (audioCtx) return;
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          sourceNode = audioCtx.createMediaElementSource(audio);

          lowpassNode = audioCtx.createBiquadFilter();
          lowpassNode.type = 'lowpass';
          lowpassNode.frequency.value = 20000;

          bassNode = audioCtx.createBiquadFilter();
          bassNode.type = 'lowshelf';
          bassNode.frequency.value = 160;
          bassNode.gain.value = 0;

          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 64;
          const bufferLength = analyser.frequencyBinCount;
          dataArray = new Uint8Array(bufferLength);

          sourceNode.connect(lowpassNode);
          lowpassNode.connect(bassNode);
          bassNode.connect(analyser);
          analyser.connect(audioCtx.destination);
        } catch(e) {
          console.warn('WebAudio initialization error:', e);
        }
      }

      function showToast(msg) {
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2200);
      }

      function updateTrack() {
        const t = tracks[currentTrackIdx];
        trackTitle.innerText = t.title;
        artistName.innerText = t.artist;
        audio.src = t.src;
        if (isPlaying) {
          audio.play().catch(() => {});
        }
      }

      function togglePlay() {
        initWebAudio();
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        if (audio.paused) {
          audio.play().then(() => {
            isPlaying = true;
            playIcon.style.display = 'none';
            pauseIcon.style.display = 'block';
            platterDisc.classList.add('spinning');
            eqBars.forEach(b => b.classList.add('active'));
            showToast('PLAYING: ' + tracks[currentTrackIdx].title.toUpperCase());
          }).catch(() => {});
        } else {
          audio.pause();
          isPlaying = false;
          playIcon.style.display = 'block';
          pauseIcon.style.display = 'none';
          platterDisc.classList.remove('spinning');
          eqBars.forEach(b => b.classList.remove('active'));
          showToast('PAUSED');
        }
      }

      playBtn.addEventListener('click', togglePlay);
      platterBtn.addEventListener('click', togglePlay);

      prevBtn.addEventListener('click', () => {
        currentTrackIdx = (currentTrackIdx - 1 + tracks.length) % tracks.length;
        updateTrack();
        showToast('TRACK: ' + tracks[currentTrackIdx].title);
      });

      nextBtn.addEventListener('click', () => {
        currentTrackIdx = (currentTrackIdx + 1) % tracks.length;
        updateTrack();
        showToast('TRACK: ' + tracks[currentTrackIdx].title);
      });

      shuffleBtn.addEventListener('click', () => {
        isShuffled = !isShuffled;
        shuffleBtn.classList.toggle('active', isShuffled);
        showToast(isShuffled ? '🔀 SHUFFLE: ON' : '🔀 SHUFFLE: OFF');
      });

      repeatBtn.addEventListener('click', () => {
        isLooped = !isLooped;
        repeatBtn.classList.toggle('active', isLooped);
        audio.loop = isLooped;
        showToast(isLooped ? '🔁 REPEAT: ALL' : '🔁 REPEAT: OFF');
      });

      heartBtn.addEventListener('click', () => {
        heartBtn.classList.toggle('active');
        showToast(heartBtn.classList.contains('active') ? '♥ ADDED TO VIP FAVORITES' : 'REMOVED FROM FAVORITES');
      });

      volSlider.addEventListener('input', (e) => {
        volume = parseFloat(e.target.value);
        audio.volume = volume;
        isMuted = volume === 0;
      });

      volBtn.addEventListener('click', () => {
        isMuted = !isMuted;
        audio.muted = isMuted;
        showToast(isMuted ? '🔇 MUTED' : '🔊 UNMUTED');
      });

      filterLow.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        if (lowpassNode) lowpassNode.frequency.value = val;
        showToast(`LPF CUTOFF: ${Math.round(val)}Hz`);
      });

      filterBass.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        if (bassNode) bassNode.gain.value = val;
        showToast(`BASS BOOST: +${val}dB`);
      });

      let stutterTimer = null;
      filterFx.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        if (stutterTimer) clearInterval(stutterTimer);
        if (val > 10) {
          const interval = Math.max(40, 300 - val * 2.5);
          stutterTimer = setInterval(() => {
            audio.volume = audio.volume > 0.1 ? 0 : volume;
          }, interval);
          showToast(`⚡ DJ CHOP FX: ${Math.round(val)}%`);
        } else {
          audio.volume = volume;
        }
      });

      // Time update
      audio.addEventListener('timeupdate', () => {
        const cur = audio.currentTime || 0;
        const dur = audio.duration || 194;
        const formatTime = (t) => {
          const m = Math.floor(t / 60);
          const s = Math.floor(t % 60);
          return `${m}:${s < 10 ? '0' : ''}${s}`;
        };
        timeDisplay.innerText = `${formatTime(cur)} / ${formatTime(dur)}`;
      });

      audio.addEventListener('ended', () => {
        if (!isLooped) {
          currentTrackIdx = (currentTrackIdx + 1) % tracks.length;
          updateTrack();
        }
      });

      // Keyboard Shortcuts
      window.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.code === 'Space') {
          e.preventDefault();
          togglePlay();
        } else if (e.key === 'ArrowLeft') {
          prevBtn.click();
        } else if (e.key === 'ArrowRight') {
          nextBtn.click();
        } else if (e.key === 'm' || e.key === 'M') {
          volBtn.click();
        }
      });

      // Canvas Visualizer Loop
      function renderVisualizer() {
        requestAnimationFrame(renderVisualizer);
        const w = canvas.width = canvas.clientWidth;
        const h = canvas.height = canvas.clientHeight;
        ctx.clearRect(0, 0, w, h);

        if (!isPlaying || !analyser) {
          // Idle ambient pulse waveform
          const bars = 28;
          const barWidth = w / bars - 2;
          for (let i = 0; i < bars; i++) {
            const idleH = Math.sin(Date.now() * 0.003 + i * 0.3) * (h * 0.15) + h * 0.2;
            const x = i * (barWidth + 2);
            ctx.fillStyle = 'rgba(255, 35, 55, 0.4)';
            ctx.fillRect(x, h - idleH, barWidth, idleH);
          }
          return;
        }

        analyser.getByteFrequencyData(dataArray);
        const bars = dataArray.length;
        const barWidth = (w / bars) * 1.8;
        let x = 0;

        for (let i = 0; i < bars; i++) {
          const val = dataArray[i];
          const barHeight = (val / 255) * h * 0.9 + 2;

          const grad = ctx.createLinearGradient(0, h - barHeight, 0, h);
          grad.addColorStop(0, '#ffffff');
          grad.addColorStop(0.3, '#ff2540');
          grad.addColorStop(1, '#660510');

          ctx.fillStyle = grad;
          ctx.shadowColor = '#ff203a';
          ctx.shadowBlur = 8;
          ctx.fillRect(x, h - barHeight, barWidth - 2, barHeight);
          x += barWidth;
        }
      }

      renderVisualizer();
    })();
  </script>
</body>
</html>
